# Reached via ANSIBLE_CONFIG, exported by tofu.env - so every ansible command
# already carries the repo's one session precondition (source tofu.env).

[defaults]
# Relative to this file: the dynamic inventory bridging tofu state to ansible.
inventory           = inventory/tofu.py
retry_files_enabled = False
interpreter_python  = auto_silent

[ssh_connection]
pipelining = True
# Host keys are per-instance noise in this fleet: every rebuild regenerates
# them, so checking is off entirely - byte-for-byte the same stance as
# scripts/vm-fingerprint.sh, and for the same reason. accept-new would be
# strictly worse: it poisons known_hosts on first contact, then hard-fails
# every run after a rebuild. /dev/null keeps the user's known_hosts clean.
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
